name: Tourism MLOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  data-preparation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas scikit-learn

      - name: Validate dataset
        run: python data_register.py

      - name: Prepare data
        run: python prep.py

      - name: Upload prepared data
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: |
            data/processed/train.csv
            data/processed/test.csv
          if-no-files-found: error

  model-training:
    runs-on: ubuntu-latest
    needs: data-preparation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: data/processed

      - name: Verify downloaded files
        run: |
          ls -l data/processed
          python -c "import pandas as pd; print('Train shape:', pd.read_csv('data/processed/train.csv').shape)"
          python -c "import pandas as pd; print('Test shape:', pd.read_csv('data/processed/test.csv').shape)"
